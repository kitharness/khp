name: Bug report
description: Something in the conformance checker or the example kit does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Conformance checker (tools/conformance)
        - Example kit (examples/docx-python)
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The command, with paths replaced by placeholders such as $REPO_ROOT.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
      description: The output (or the relevant part of the report) and the requirement id, if one applies.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and the repository commit.
    validations:
      required: true
