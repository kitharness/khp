<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 596" width="1280" height="596" role="img" aria-labelledby="t d">
<title id="t">khp check passing the DOCX example kit at the basic tier</title><desc id="d">Genuine output of the conformance checker run against examples/docx-python at --level basic: the claim is verified and phases 1 manifest, 2 launch, 3 tools, 4 schemas, 5 act, 6 verify, 9 files, 11 containment and 12 probes pass; A7 and A26 are attested by the kit's own tests. Exit status 0.</desc>
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;white-space:pre}.cmd{fill:#5eead4}.out{fill:#e7eaf0}.dim{fill:#6c7584}.ok{fill:#86efac}.err{fill:#fca5a5}.res{fill:#a1aab8}.cap{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#a1aab8}</style>
<rect width="1280" height="596" rx="16" fill="#0a0c10" stroke="#2c3440" stroke-width="1.5"/>
<rect x="1" y="1" width="1278" height="44" rx="15" fill="#12161c"/><rect x="1" y="30" width="1278" height="15" fill="#12161c"/>
<line x1="0" y1="45" x2="1280" y2="45" stroke="#2c3440"/>
<circle cx="28" cy="23" r="6" fill="#3a4250"/><circle cx="48" cy="23" r="6" fill="#3a4250"/><circle cx="68" cy="23" r="6" fill="#3a4250"/>
<text class="cap" x="92" y="28">tools/conformance · real output of khp check (paths shown as $REPO_ROOT placeholders; long notes omitted)</text>
<text class="m cmd" x="48" y="82" xml:space="preserve">$ node tools/conformance/dist/cli.js check \</text>
<text class="m cmd" x="48" y="102" xml:space="preserve">    --kit "\"$KHP_PYTHON_ENV/bin/python\" -B \"$REPO_ROOT/examples/docx-python/server.py\" --workspace {workspace} --actor \"Example Owner\"" \</text>
<text class="m cmd" x="48" y="122" xml:space="preserve">    --package "$REPO_ROOT/examples/docx-python" --fixtures "$REPO_ROOT/examples/docx-python/conformance" --level basic</text>
<text class="m ok" x="48" y="142" xml:space="preserve">KHP 1.0 · org.example.docx-python 0.1.0 · tier basic: passed</text>
<text class="m out" x="48" y="162" xml:space="preserve">  claim verified: kit.json claims basic; this run tested basic and passed, which verifies the claim (K19)</text>
<text class="m ok" x="48" y="182" xml:space="preserve">  pass  1 manifest</text>
<text class="m ok" x="48" y="202" xml:space="preserve">  pass  2 launch</text>
<text class="m dim" x="48" y="222" xml:space="preserve">        · initialize answered within 10 s (server org.example.docx-python 0.1.0)</text>
<text class="m ok" x="48" y="242" xml:space="preserve">  pass  3 tools</text>
<text class="m ok" x="48" y="262" xml:space="preserve">  pass  4 schemas</text>
<text class="m dim" x="48" y="282" xml:space="preserve">        · 6 commands listed by docx_commands without a query (it counts 6)</text>
<text class="m ok" x="48" y="302" xml:space="preserve">  pass  5 act</text>
<text class="m ok" x="48" y="322" xml:space="preserve">  pass  6 verify</text>
<text class="m ok" x="48" y="342" xml:space="preserve">  pass  9 files</text>
<text class="m dim" x="48" y="362" xml:space="preserve">        · no listed command has a `file` parameter, so A29 was checked through `path` alone</text>
<text class="m ok" x="48" y="382" xml:space="preserve">  pass  11 containment</text>
<text class="m dim" x="48" y="402" xml:space="preserve">        [7 longer detail lines omitted here]</text>
<text class="m ok" x="48" y="422" xml:space="preserve">  pass  12 probes</text>
<text class="m dim" x="48" y="442" xml:space="preserve">        [1 longer detail line omitted here]</text>
<text class="m dim" x="48" y="462" xml:space="preserve">        · docx_batch is not offered, so no command ran through a batch</text>
<text class="m dim" x="48" y="482" xml:space="preserve">  attested by the kit's own tests, not by khp check: A7, A26</text>
<text class="m dim" x="48" y="502" xml:space="preserve">$ echo $?</text>
<text class="m out" x="48" y="522" xml:space="preserve">0</text>
