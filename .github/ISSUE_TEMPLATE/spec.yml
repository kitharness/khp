name: Specification change
description: Propose a change or an addition to the protocol.
labels: [spec]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a kit, a harness, or an agent cannot do or gets wrong today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposed change
      description: Name the page and the requirement ids it touches (for example A29 or K2). Say whether it only adds (a minor version) or changes or removes a requirement (a major version).
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: How conformance would check it
      description: What khp check could observe, or why the requirement would be attested instead.
